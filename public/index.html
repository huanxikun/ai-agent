<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="支持后台任务、持久任务与长链路代码研究的代码 Agent" />
    <title>My Agent</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="My Agent 首页">
          <span class="brand-mark">A</span>
          <strong>My Agent</strong>
        </a>
        <div class="status">
          <span class="status-dot"></span>
          <span id="providerStatus">连接中…</span>
        </div>
      </header>

      <main class="workspace">
        <section class="chat-panel">
          <div class="intro" id="intro">
            <div class="eyebrow">Code Agent</div>
            <h1>有什么可以帮你？</h1>
            <p>输入问题或需求，Agent 会自动规划步骤、调用工具、执行代码研究并返回结果。</p>
            <div class="feature-strip" aria-label="能力概览">
              <span>工具链路</span>
              <span>后台任务</span>
              <span>流式输出</span>
            </div>
          </div>
          <div class="messages" id="messages" aria-live="polite"></div>
          <form class="composer" id="chatForm">
            <textarea
              id="messageInput"
              rows="1"
              maxlength="4000"
              placeholder="输入消息…"
              aria-label="消息"
            ></textarea>
            <button type="submit" id="sendButton" aria-label="发送">
              <b>↑</b>
            </button>
          </form>
        </section>

        <aside class="trace-panel">
          <div class="trace-header">
            <div>
              <span class="eyebrow">Trace</span>
              <h2>运行轨迹</h2>
              <p class="trace-subtitle">模型调用、工具执行与任务通知。</p>
            </div>
            <button class="icon-button" id="resetButton" title="重置会话">↻</button>
          </div>
          <div class="todo-panel" id="todoPanel" style="display:none;">
            <div class="todo-header">
              <span class="eyebrow">Steps</span>
              <span class="todo-progress" id="todoProgress"></span>
            </div>
            <ul class="todo-list" id="todoList"></ul>
          </div>
          <div class="trace-empty" id="traceEmpty">
            <div class="pulse-ring"><span></span></div>
            <p>发送消息后，这里会显示工具执行链路和运行状态。</p>
          </div>
          <ol class="trace-list" id="traceList"></ol>
          <div class="trace-summary" id="traceSummary">
            <span><b id="stepCount">0</b> 模型步数</span>
            <span><b id="toolCount">0</b> 工具调用</span>
          </div>
        </aside>
      </main>
    </div>
    <script src="/marked.min.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
