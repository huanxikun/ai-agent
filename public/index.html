<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="从 s01 开始学习 Agent Loop" />
    <title>My Agent · s01</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="My Agent Harness 首页">
          <span class="brand-mark">A</span>
          <span>
            <strong>My Agent</strong>
            <small>s01 · Java</small>
          </span>
        </a>
        <div class="status">
          <span class="status-dot"></span>
          <span id="providerStatus">连接中…</span>
        </div>
      </header>

      <main class="workspace">
        <section class="chat-panel">
          <div class="intro" id="intro">
            <div class="eyebrow">STEP 01 · AGENT LOOP</div>
            <h1>一个循环<br />一个工具</h1>
            <p>模型决定是否调用工具，Java 执行工具，再把结果交回模型。</p>
            <div class="suggestions">
              <button data-prompt="现在上海几点？">查看当前时间 <span>↗</span></button>
              <button data-prompt="现在纽约几点？">换一个时区 <span>↗</span></button>
              <button data-prompt="介绍一下 s01 Agent Loop">了解这个循环 <span>↗</span></button>
            </div>
          </div>
          <div class="messages" id="messages" aria-live="polite"></div>
          <form class="composer" id="chatForm">
            <textarea
              id="messageInput"
              rows="1"
              maxlength="4000"
              placeholder="给你的 Agent 发一条消息…"
              aria-label="消息"
            ></textarea>
            <button type="submit" id="sendButton" aria-label="发送">
              <span>发送</span><b>↑</b>
            </button>
          </form>
        </section>

        <aside class="trace-panel">
          <div class="trace-header">
            <div>
              <span class="eyebrow">LIVE TRACE</span>
              <h2>s01 运行轨迹</h2>
            </div>
            <button class="icon-button" id="resetButton" title="重置会话">↻</button>
          </div>
          <div class="trace-empty" id="traceEmpty">
            <div class="pulse-ring"><span></span></div>
            <p>发送一条消息后，这里会显示模型调用、工具执行和停止条件。</p>
          </div>
          <ol class="trace-list" id="traceList"></ol>
          <div class="trace-summary" id="traceSummary">
            <span><b id="stepCount">0</b> 模型步数</span>
            <span><b id="toolCount">0</b> 工具调用</span>
            <span><b id="duration">0</b> ms</span>
          </div>
        </aside>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
