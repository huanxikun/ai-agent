<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="支持跨压缩、跨会话 Memory 的代码 Agent" />
    <title>My Agent · S09 Memory</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="My Agent Harness 首页">
          <span class="brand-mark">A</span>
          <span>
            <strong>My Agent</strong>
            <small>s09 · Memory</small>
          </span>
        </a>
        <div class="status">
          <span class="status-dot"></span>
          <span id="providerStatus">连接中…</span>
        </div>
      </header>

      <main class="workspace">
        <section class="chat-panel">
          <div class="intro" id="intro">
            <div class="eyebrow">STEP 09 · MEMORY</div>
            <h1>压缩会丢细节<br />Memory 不会</h1>
            <p>索引常驻 System，相关记忆在压缩后智能加载，完整细节跨会话保留。</p>
          </div>
          <div class="messages" id="messages" aria-live="polite"></div>
          <form class="composer" id="chatForm">
            <textarea
              id="messageInput"
              rows="1"
              maxlength="4000"
              placeholder="询问这个项目中的代码…"
              aria-label="消息"
            ></textarea>
            <button type="submit" id="sendButton" aria-label="发送">
              <span>发送</span><b>↑</b>
            </button>
          </form>
        </section>

        <aside class="trace-panel">
          <div class="trace-header">
            <div>
              <span class="eyebrow">LIVE TRACE</span>
              <h2>Harness 运行轨迹</h2>
            </div>
            <button class="icon-button" id="resetButton" title="重置会话">↻</button>
          </div>
          <div class="trace-empty" id="traceEmpty">
            <div class="pulse-ring"><span></span></div>
            <p>发送一条消息后，这里会显示模型调用、工具执行和停止条件。</p>
          </div>
          <ol class="trace-list" id="traceList"></ol>
          <div class="trace-summary" id="traceSummary">
            <span><b id="stepCount">0</b> 模型步数</span>
            <span><b id="toolCount">0</b> 工具调用</span>
          </div>
        </aside>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
